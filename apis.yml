    data, with lifecycle domains (plan, rate, enrollment) plus standardized schemas,
    OpenAPI specs, sandbox environments and event-driven webhook subscriptions as
    active investments. Every route on the gateway answers MISSING_AUTHENTICATION_TOKEN
    without partner credentials; the contract is not published.'
