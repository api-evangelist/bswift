aid: bswift
name: bswift
description: 'bswift is a benefits administration platform used by employers, brokers
  and channel partners to run health and welfare benefits — eligibility, annual enrollment,
  life events, COBRA, billing and ACA compliance — with an AI assistant (Emma) layered
  over the employee experience. Founded in Chicago in 2000, bswift was acquired by
  Aetna in 2014, moved into CVS Health, and has operated as an independent company
  backed by Francisco Partners since the 2022 carve-out. It runs a large connectivity
  estate: 450+ active carrier file feeds, 300+ pre-built and API integrations, and
  150+ API and SSO connections into HCM and payroll platforms including ADP, UKG, Paylocity
  and Workday. Its production API gateway is live at api.bswift.com, but the REST contract
  — along with the OpenAPI specs, sandbox environments and webhook event topics bswift
  describes publicly — is issued only to alliance, integration and channel partners;
  there is no public developer portal or API reference.'
